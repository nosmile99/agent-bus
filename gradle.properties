# Project-wide Gradle settings.
# Note: -Djava.net.preferIPv4Stack=true works around broken IPv6-mapped localhost
# sockets in sandboxed CI environments (Gradle client<->daemon handshake hangs
# without it). Harmless on normal machines.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
